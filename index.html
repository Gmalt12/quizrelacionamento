<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexo - Quiz Personalizado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="quiz-app">
        <header>
            <button class="back-btn" id="back-btn" onclick="back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="logo">
                <div class="nexo-logo" style="font-size: 18px;" aria-label="Nexo">
                    <span class="nexo-n">N</span>
                    <span class="nexo-e">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                    <span class="nexo-x">X</span>
                    <span class="nexo-o">O</span>
                </div>
            </div>
        </header>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>

        <main id="quiz-container">
            <!-- Steps will be rendered here via JS -->
        </main>
    </div>

    <!-- Modals for Loading Step -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-close" onclick="closeModal()">✕</div>
            <h2 id="modal-title" style="font-size: 20px; margin-bottom: 10px;">Pergunta</h2>
            <p id="modal-text" style="font-size: 14px; color: #666;">Descrição da pergunta modal.</p>
            <div class="modal-btns">
                <div class="modal-btn" onclick="closeModal()">
                    <span>👎</span>
                    <span>Não</span>
                </div>
                <div class="modal-btn" onclick="closeModal()">
                    <span>👍</span>
                    <span>Sim</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/quiz.js"></script>
    <script>
        // Modal Logic helper
        function openModal(title, text) {
            document.getElementById("modal-title").textContent = title;
            document.getElementById("modal-text").textContent = text;
            document.getElementById("modal-overlay").style.display = "flex";
        }
        function closeModal() {
            document.getElementById("modal-overlay").style.display = "none";
        }
    </script>
</body>
</html>
